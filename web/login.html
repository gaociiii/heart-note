<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8edf2"><title>欢迎回来 · 心动纸条</title><link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:25px;background:radial-gradient(ellipse at 20% 20%,#f1e2ed,transparent 55%),#faf5f6;color:#493a48;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.login{width:100%;max-width:410px;background:#fffcfaf2;border:1px solid #eadfe5;border-radius:24px;padding:42px 32px;box-shadow:0 20px 70px #7c50600b;position:relative}.login:before{content:"";position:absolute;top:-12px;left:calc(50% - 35px);width:70px;height:26px;transform:rotate(-6deg);background:#dfcfe2a0}.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-family:SimSun,serif;font-size:23px}.brand img{width:37px}h1{font:400 29px/1.7 "Songti SC",SimSun,serif;text-align:center;margin:33px 0 8px;letter-spacing:2px}.subtitle{text-align:center;font-size:12px;color:#988691;line-height:1.9;margin:0 0 28px}label{display:block;font-size:12px;margin:19px 0 9px}input,button{font:inherit;width:100%;border-radius:11px;padding:14px}input{border:1px solid #eadfe5;color:#493a48;background:white;font-size:15px;outline-color:#aa5d7c}button{margin-top:12px;border:0;background:#aa5d7c;color:white;cursor:pointer;font-size:14px}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #c7a4d6;outline-offset:3px}.error{color:#a2496c;font-size:12px;line-height:1.8;min-height:22px;margin:12px 0 0}.foot{text-align:center;font-size:10px;color:#b29eaa;letter-spacing:2px;margin:28px 0 0}@media(max-width:400px){.login{padding:35px 24px}}
</style></head><body><main class="login"><div class="brand"><img src="/icon.svg" alt="">心动纸条</div><h1>今晚，等你开场。</h1><p class="subtitle">登录主持人账号，<br>打开属于你们的温柔时刻。</p><form id="login-form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required maxlength="100" autocapitalize="none" spellcheck="false"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><p id="error" class="error" role="alert"></p><button id="login-button">登录，打开纸条</button></form><p class="foot">♡ 自在表达，温柔靠近 ♡</p></main><script src="/login.js"></script><script src="/pwa.js"></script></body></html>
